name: trucoviski2

services:
  server:
    build:
      context: .
      target: server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "2568"
      SQLITE_PATH: ${SQLITE_PATH:-/data/trucoviski.sqlite}
      MONITOR_USER: ${MONITOR_USER:?set MONITOR_USER in .env}
      MONITOR_PASSWORD: ${MONITOR_PASSWORD:?set MONITOR_PASSWORD in .env}
    volumes:
      - server-data:/data
    ports:
      - "127.0.0.1:${HOST_BIND_PORT:-2568}:2568"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:2568/healthz').then((response) =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  server-data:
