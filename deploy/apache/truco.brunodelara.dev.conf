# Install on the VPS as /etc/apache2/sites-available/truco.brunodelara.dev.conf.
# Apache owns public HTTP(S); Docker only listens on 127.0.0.1:2568.
<VirtualHost *:80>
    ServerName truco.brunodelara.dev

    ProxyPreserveHost On

    # WebSocket upgrades must be proxied to the same Colyseus server.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(.*) ws://127.0.0.1:2568/$1 [P,L]

    ProxyPass        / http://127.0.0.1:2568/ connectiontimeout=5 timeout=60
    ProxyPassReverse / http://127.0.0.1:2568/

    # The monitor is only reachable through an SSH tunnel to the loopback port.
    <LocationMatch "(?i)^/monitor(/|$)">
        Require all denied
    </LocationMatch>

    RemoteIPHeader CF-Connecting-IP
    RemoteIPTrustedProxy 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32
    LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" cf_combined
    ErrorLog ${APACHE_LOG_DIR}/truco.brunodelara.dev-error.log
    CustomLog ${APACHE_LOG_DIR}/truco.brunodelara.dev-access.log cf_combined
</VirtualHost>
